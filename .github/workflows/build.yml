name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y build-essential git openjdk-17-jdk unzip zip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev zlib1g-dev autoconf libtool pkg-config librsvg2-bin
      - name: Convert icon SVG to PNG
        run: rsvg-convert -w 512 -h 512 icon.svg -o icon.png
      - run: pip install --upgrade buildozer "cython<3.0"
      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          find . -name "*.apk" 2>/dev/null || echo "APK не найден"
          ls -la bin/ 2>/dev/null || echo "Папка bin/ не существует"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: bin/*.apk
          if-no-files-found: warn
